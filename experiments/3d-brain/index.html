<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Azure Digital Brain</title>
</head>
<body>
  <p>Das 3D Brain ist Teil der gemeinsamen Brain-Oberfläche. <a id="brainLink" href="../../app/index.html#mode=brain&amp;renderer=3d">Brain öffnen</a></p>
  <script>
    const query = new URLSearchParams(location.search);
    const incoming = new URLSearchParams(location.hash.slice(1));
    const target = new URLSearchParams({ mode: 'brain', renderer: '3d' });
    for (const key of ['node', 'domain', 'center', 'view']) {
      const value = query.get(key) || incoming.get(key);
      if (value) target.set(key, value);
    }
    if (!target.has('node') && !target.has('domain')) target.set('view', 'overview');
    const href = `../../app/index.html#${target.toString()}`;
    document.getElementById('brainLink').href = href;
    location.replace(href);
  </script>
</body>
</html>
